<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Contact — StudentHub</title>
</head>

<body>
    <nav>
        <h3>StudentHub</h3>
        <div class="navi">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="find-opportunities.html">Find Opportunities</a>
                <a href="saved.html">Saved</a>
                <a href="post-opportunity.html">Post Opportunities</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-two">
                <a href="login.html" class="login">Login</a>
                <a href="signup.html" class="signup">SignUp</a>
            </div>
        </div>
    </nav>
    <hr>

    <div class="auth-page">
        <div class="auth-card wide-card">
            <span class="auth-tag">Get In Touch</span>
            <h2 class="auth-title">Contact Us</h2>
            <p class="auth-subtitle">Have a question, suggestion, or want to partner with us? Send a message below.</p>

            <form>
                <div class="form-group">
                    <label for="name" class="control-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="cEmail" class="control-label">Email</label>
                    <input type="email" class="form-control" id="cEmail" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="subject" class="control-label">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="What's this about?">
                </div>

                <div class="form-group">
                    <label for="message" class="control-label">Message</label>
                    <textarea class="form-control" id="message" rows="5"
                        placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="btn-signin">Send Message</button>
            </form>
        </div>
    </div>

</body>

</html>
