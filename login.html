<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentHub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <div class="auth-card">
            <div class="auth-blob"></div>
            <span class="auth-tag">For Nigerian Students</span>
            <h2 class="auth-title">Welcome Back!</h2>
            <p class="auth-subtitle">Login to continue finding opportunities</p>

            <form>
                <div class="form-group">
                    <label for="email" class="control-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Email">
                </div>

                <div class="form-group">
                    <label for="password" class="control-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="Password">
                        <button type="button" class="toggle-password" id="toggleBtn">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group checkbox">
                    <label><input type="checkbox"> Remember me</label>
                </div>

                <button type="submit" class="btn-signin">Sign in</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </main>


</body>

</html>
